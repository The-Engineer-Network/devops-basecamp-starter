name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Build server image
        run: |
          docker build -t basecamp-server ./server
      - name: Lint / Test placeholder
        run: echo "Add tests and linting in the repo"
